spring:
  application:
    name: arora

  datasource:
    url: jdbc:h2:mem:arora
    username: sa
    password:
    driver-class-name: org.h2.Driver

    h2:
      console:
        enabled: true
        path: /h2-console

    jpa:
      hibernate:
        ddl-auto: create-drop
      show-sql: true

server:
  port: 8081
  servlet:
    context-path: /api/v1

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE